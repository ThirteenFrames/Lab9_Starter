<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>

  <style>
    button {
      margin: 3px;
    }

    button:hover {
      cursor: pointer;
    }

    #first-num,
    #second-num {
      width: 60px;
    }

    output {
      border: 1px solid gray;
      display: block;
      height: 18px;
      margin-top: 5px;
      padding: 5px;
      width: 240px;
    }

    main {
      width: 800px;
    }

    #error-btns {
      column-gap: 5px;
      display: flex;
      flex-wrap: wrap;
      margin-top: 30px;
      row-gap: 5px;
    }

    #error-btns>* {
      padding: 8px 2px;
      width: 122px;
    }
  </style>
</head>

<body>
  <main>
    <form>
      <fieldset>
        <legend>Error Calculator</legend>
        <input name="first-num" id="first-num" />
        <select name="operator" id="operator">
          <option>+</option>
          <option>-</option>
          <option>*</option>
          <option>/</option>
        </select>
        <input name="second-num" id="second-num" />
        <button id="calculate">Calculate</button>
        <br />
        <output></output>
      </fieldset>
    </form>
    
    <section id="error-btns">
      <button id="log">Console Log</button>
      <button id="error">Console Error</button>
      <button id="count">Console Count</button>
      <button id="warn">Console Warn</button>
      <button id="assert">Console Assert</button>
      <button id="clear">Console Clear</button>
      <button id="dir">Console Dir</button>
      <button id="dirxml">Console dirxml</button>
      <button id="group-start">Console Group Start</button>
      <button id="group-end">Console Group End</button>
      <button id="table">Console Table</button>
      <button id="start-timer">Start Timer</button>
      <button id="end-timer">End Timer</button>
      <button id="trace">Console Trace</button>
      <button id="global-error">Trigger a Global Error</button>
    </section>
  </main>
  

  <script>
    let form = document.querySelector('form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      let output = document.querySelector('output');
      let firstNum = document.querySelector('#first-num').value;
      let secondNum = document.querySelector('#second-num').value;
      let operator = document.querySelector('#operator').value;


      // part 4
      class CalculationError extends Error {
        constructor(message) {
          super(message);
          this.name = "CalculationError";
        }
      }

      // part 3
      try {
        output.innerHTML = eval(`${firstNum} ${operator} ${secondNum}`);
      } catch (e) {
        alert("Check your inputs and try again!");

        // part 4
        throw new CalculationError("invalid arguments for calculation.");

      } finally {
        console.log("Calculation attempted!")
      }
      
    });

    let errorBtns = Array.from(document.querySelectorAll('#error-btns > button'));

    // Start your code here
    // You may move this JS to another file if you wish


    // part 5
    window.onerror = function(message, source, lineno, colno, error) {
      console.log("Global Error Caught");
    };

    // part 2
    errorBtns.forEach((button) => {
      button.addEventListener('click', (event) => {
          switch (button.id) {
          case "log":
            console.log("Console Log Demo");
            break; 
          case "error":
            console.error("Console Error Demo");
            break;
          case "count":
            console.count("Count Button"); 
            break;
          case "warn": 
            console.warn("Console Warn Button");
            break;
          case "assert": 
            console.assert(2+2 == 5);
            break;
          case "clear": 
            console.clear();
            break;
          case "dir": 
            console.dir(button);
            break;
          case "dirxml": 
            console.dirxml(button);
            break;
          case "group-start": 
            console.group("console.group");
            break;
          case "group-end": 
            console.groupEnd();
            break;
          case "table": 
            console.table(errorBtns);
            break;
          case "start-timer": 
            console.time("timer-button");
            break;
          case "end-timer": 
            console.timeEnd("timer-button");
            break;
          case "trace": 
            const deepest = () => {console.trace("Console Trace Demo")};
            const deeper = () => {deepest()};
            const deep = () => {deeper()};
            deep();
            break;
          // part 5
          case "global-error":
            let arr = undefined;
            console.log(arr.length); // should cause uncaught error
            break;
        }
      })
      
    })

  </script>
</body>

</html>
